<!DOCTYPE html>
<html lang="en-IE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<header>
    <div class="brand">
      <img src="images/logo.svg" alt="Logo: a gold coin with a euro sign and clock markings" width="48" height="48">
      <h1>Monthly Expense Tracker</h1>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="#summary">Summary</a></li>
        <li><a href="#transactions">Transactions</a></li>
        <li><a href="#add-expense">Add expense</a></li>
        <li><a href="#income">Income</a></li>
        <li><a href="#holidays">Holidays</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section id="summary" class="summary-card">
      <h2>Your balance</h2>
      <p id="balance" class="balance-amount">€0.00</p>
      <div class="summary-boxes">
        <div class="summary-box">
          <h3>Income</h3>
          <p id="income-total">€0.00</p>
        </div>
        <div class="summary-box">
          <h3>Expenses</h3>
          <p id="expense-total">€0.00</p>
          </div>
      </div>
    </section>

    <div class="row">
      <section id="transactions">
        <h2>Transactions</h2>
        <ul id="transaction-list" class="transaction-list"></ul>
      </section>

      <section id="add-expense" class="card">
        <h2>Add expense</h2>
        <form id="expense-form" novalidate>
          <label for="expense-description">Description</label>
          <input type="text" id="expense-description" placeholder="e.g. Bus fare" required>
          <label for="expense-amount">Amount (€)</label>
          <input type="number" id="expense-amount" placeholder="e.g. 4.50" min="0.01" step="0.01" required>
          <button type="submit">Add expense</button>
          <p id="expense-message" class="message" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
